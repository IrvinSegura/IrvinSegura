<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="128" viewBox="0 0 1000 128" role="img" aria-labelledby="title">
<title id="title">Nexus (App Android): Red social con feed offline, historias con música, círculos privados con código de invitación y mensajes directos entre miembros. Multi-módulo con Clean Architecture y MVI. Tecnologías: Kotlin, Jetpack Compose, Hilt, Room, Firebase, Supabase.</title>
