<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-labelledby="title">
<title id="title">Gestión de Créditos: Python, Flask, SQLite, reportes en Excel y PDF</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#0F1C30"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<radialGradient id="glow" cx="0.9" cy="0" r="0.75"><stop offset="0" stop-color="#38BDF8" stop-opacity=".14"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#FFFFFF" stroke-opacity=".035"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8B9AB0"/></marker>
</defs>
<style>
.sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,Menlo,monospace}
.flow{stroke-dasharray:4 6;animation:dash 1s linear infinite}
.cursor{animation:blink 1.1s steps(1) infinite}
@keyframes dash{to{stroke-dashoffset:-20}}
@keyframes blink{50%{fill-opacity:0}}
@media (prefers-reduced-motion:reduce){.flow,.cursor{animation:none}.pulse{display:none}}
</style>
<rect x=".5" y=".5" width="999" height="349" rx="16" fill="url(#bg)"/>
<rect x=".5" y=".5" width="999" height="349" rx="16" fill="url(#grid)"/>
<rect x=".5" y=".5" width="999" height="349" rx="16" fill="url(#glow)" stroke="#1E2B3F"/>
<text x="40" y="52" class="mono" font-size="12" font-weight="600" fill="#FBBF24" text-anchor="start" letter-spacing="1.5">PYTHON · FLASK · FINANZAS</text>
<text x="40" y="90" class="sans" font-size="28" font-weight="700" fill="#E6EDF3" text-anchor="start">Gestión de Créditos</text>
<text x="40" y="122" class="sans" font-size="15" font-weight="400" fill="#8B9AB0" text-anchor="start">Cartera de créditos con cuota fija, pagos, control de atrasos y estados de cuenta.</text>
<text x="40" y="145" class="sans" font-size="15" font-weight="400" fill="#8B9AB0" text-anchor="start">Montos en decimales exactos, reportes en Excel y PDF, y roles Administrador, Analista y Consulta.</text>
<rect x="352" y="156" width="620" height="124" rx="14" fill="none" stroke="#FBBF24" stroke-opacity=".45" stroke-dasharray="6 5"/>
<text x="368" y="176" class="mono" font-size="11" font-weight="600" fill="#FBBF24" text-anchor="start" letter-spacing="1.2">WAITRESS · RESPALDOS AUTOMÁTICOS</text>
<rect x="40" y="186" width="270" height="72" rx="10" fill="#111D30" stroke="#26364F"/>
<rect x="40" y="198" width="3" height="48" rx="1.5" fill="#38BDF8"/>
<text x="58" y="207" class="mono" font-size="11" font-weight="600" fill="#38BDF8" text-anchor="start" letter-spacing="1.2">CLIENTE WEB</text>
<text x="58" y="229" class="sans" font-size="16" font-weight="600" fill="#E6EDF3" text-anchor="start">JavaScript + Bootstrap</text>
<text x="58" y="248" class="sans" font-size="13" font-weight="400" fill="#8B9AB0" text-anchor="start">Chart.js · tema claro y oscuro</text>
<rect x="372" y="186" width="290" height="72" rx="10" fill="#111D30" stroke="#26364F"/>
<rect x="372" y="198" width="3" height="48" rx="1.5" fill="#60A5FA"/>
<text x="390" y="207" class="mono" font-size="11" font-weight="600" fill="#60A5FA" text-anchor="start" letter-spacing="1.2">API REST · OPENAPI</text>
<text x="390" y="229" class="sans" font-size="16" font-weight="600" fill="#E6EDF3" text-anchor="start">Python + Flask</text>
<text x="390" y="248" class="sans" font-size="13" font-weight="400" fill="#8B9AB0" text-anchor="start">CSRF · CSP con nonce · roles</text>
<rect x="712" y="186" width="244" height="72" rx="10" fill="#111D30" stroke="#26364F"/>
<rect x="712" y="198" width="3" height="48" rx="1.5" fill="#A78BFA"/>
<text x="730" y="207" class="mono" font-size="11" font-weight="600" fill="#A78BFA" text-anchor="start" letter-spacing="1.2">BASE DE DATOS</text>
<text x="730" y="229" class="sans" font-size="16" font-weight="600" fill="#E6EDF3" text-anchor="start">SQLite</text>
<text x="730" y="248" class="sans" font-size="13" font-weight="400" fill="#8B9AB0" text-anchor="start">SQLAlchemy · Alembic</text>
<line x1="312" y1="222" x2="368" y2="222" stroke="#26364F" stroke-width="2"/><line x1="312" y1="222" x2="368" y2="222" class="flow" stroke="#38BDF8" stroke-opacity=".85" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<line x1="664" y1="222" x2="708" y2="222" stroke="#26364F" stroke-width="2"/><line x1="664" y1="222" x2="708" y2="222" class="flow" stroke="#60A5FA" stroke-opacity=".85" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<circle class="pulse" r="3.5" fill="#38BDF8"><animateMotion dur="1.4s" begin="-0.0s" repeatCount="indefinite" path="M312,222 L368,222"/></circle>
<circle class="pulse" r="3.5" fill="#60A5FA"><animateMotion dur="1.4s" begin="-0.7s" repeatCount="indefinite" path="M664,222 L708,222"/></circle>
<rect x="40" y="302" width="176" height="26" rx="13.0" fill="#FBBF24" fill-opacity=".08" stroke="#FBBF24" stroke-opacity=".45"/><text x="128.0" y="319.32" class="mono" font-size="12" font-weight="500" fill="#E6EDF3" text-anchor="middle">Tabla de amortización</text>
<rect x="224" y="302" width="176" height="26" rx="13.0" fill="#FBBF24" fill-opacity=".08" stroke="#FBBF24" stroke-opacity=".45"/><text x="312.0" y="319.32" class="mono" font-size="12" font-weight="500" fill="#E6EDF3" text-anchor="middle">Edición segura (ETag)</text>
<rect x="408" y="302" width="169" height="26" rx="13.0" fill="#FBBF24" fill-opacity=".08" stroke="#FBBF24" stroke-opacity=".45"/><text x="492.5" y="319.32" class="mono" font-size="12" font-weight="500" fill="#E6EDF3" text-anchor="middle">Bloqueo por intentos</text>
<rect x="585" y="302" width="139" height="26" rx="13.0" fill="#FBBF24" fill-opacity=".08" stroke="#FBBF24" stroke-opacity=".45"/><text x="654.5" y="319.32" class="mono" font-size="12" font-weight="500" fill="#E6EDF3" text-anchor="middle">Cobertura ≥ 90 %</text>
<rect x="732" y="302" width="161" height="26" rx="13.0" fill="#FBBF24" fill-opacity=".08" stroke="#FBBF24" stroke-opacity=".45"/><text x="812.5" y="319.32" class="mono" font-size="12" font-weight="500" fill="#E6EDF3" text-anchor="middle">pytest + Playwright</text>
</svg>
