<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title">
<title id="title">Irvin Segura Ortiz, desarrollador full stack</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#0F1C30"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<radialGradient id="glow" cx="0.9" cy="0" r="0.75"><stop offset="0" stop-color="#38BDF8" stop-opacity=".14"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#FFFFFF" stroke-opacity=".035"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8B9AB0"/></marker>
</defs>
<style>
.sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,Menlo,monospace}
.flow{stroke-dasharray:4 6;animation:dash 1s linear infinite}
.cursor{animation:blink 1.1s steps(1) infinite}
@keyframes dash{to{stroke-dashoffset:-20}}
@keyframes blink{50%{fill-opacity:0}}
@media (prefers-reduced-motion:reduce){.flow,.cursor{animation:none}.pulse{display:none}}
</style>
<rect x=".5" y=".5" width="999" height="319" rx="16" fill="url(#bg)"/>
<rect x=".5" y=".5" width="999" height="319" rx="16" fill="url(#grid)"/>
<rect x=".5" y=".5" width="999" height="319" rx="16" fill="url(#glow)" stroke="#1E2B3F"/>
